<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bai3.css">
</head>

<body>
    <div class="register-container">
        <h2>Đăng ký</h2>
        <p class="subtitle">Tạo tài khoản để bắt đầu học tập trên hệ thống e-learning</p>

        <form>
            <div class="row">
                <div class="input-group">
                    <label for="first-name">Họ và tên đệm</label>
                    <input type="text" id="first-name" placeholder="Nguyễn Văn">
                </div>
                <div class="input-group">
                    <label for="last-name">Tên đầy đủ</label>
                    <input type="text" id="last-name" placeholder="An">
                </div>
            </div>

            <div class="input-group">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" placeholder="0912 345 678">
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Nhập địa chỉ email">
            </div>

            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu">
            </div>

            <div class="input-group">
                <label for="confirm-password">Nhập lại mật khẩu</label>
                <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu">
            </div>

            <button type="submit" class="btn-register">Đăng ký</button>
        </form>

        <div class="login-link">
            Đã có tài khoản? <a href="#">Đăng nhập</a>
        </div>
    </div>
</body>

</html>
