<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê Học Tập</title>
    <link rel="stylesheet" href="./bai7.css">
</head>
<body>

    <div class="stats-container">
        <h2 class="stats-title">Thống Kê Học Tập</h2>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">📚</div>
                <div class="number">4</div>
                <div class="label">Tổng khóa học</div>
            </div>

            <div class="stat-card">
                <div class="icon">🎯</div>
                <div class="number">2</div>
                <div class="label">Đang học</div>
            </div>

            <div class="stat-card">
                <div class="icon">✅</div>
                <div class="number">1</div>
                <div class="label">Hoàn thành</div>
            </div>

            <div class="stat-card">
                <div class="icon">⏰</div>
                <div class="number">43</div>
                <div class="label">Giờ học</div>
            </div>

            <div class="stat-card">
                <div class="icon">📜</div>
                <div class="number">1</div>
                <div class="label">Chứng chỉ</div>
            </div>
        </div>
    </div>

</body>
</html>
