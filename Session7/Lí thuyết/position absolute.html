<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* reset */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100px;
            height: 100px;
            border: 1px solid black;
            background-color: green;
            margin: 30px;
            position: absolute;
        }
        .content{
            width: 50px;
            height: 50px;
            background-color: red;
            position: absolute;
            right: 0;
        }
    </style>
</head>
<body>
    <!-- 
    - Tìm phần tử cha gần nhất có thuộc tính position có giá trị khác static thì sẽ lấu phần tử đó làm mốc
    - Không thấy sẽ ăn được trình duyệt
    -->
    <div class="container">
        <div class="content">
            K25_CNTT1
        </div>
    </div>
</body>
</html>
