<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .lop2{
            margin: 10px; /*1px =2,54/300cm  Ngoài px thì còn 1 số đơn vị như vh, em */
            border: 5px dashed black;/* Độ rộng của đường viền*/
        }
        .lop1{
            height: 100;
            width: 100;
            padding: 25px;
        }
    </style>
</head>
<body>
    <!-- 
    box model: Mô hình hộp 
     - border: độ dày của viền
     - margin: khoảng cách từ border đến phần tử khác
     - padding: khoảng cách từ border đến nội dung
     - content
     -->
    <div class="lop1" style="background-color: tomato;">cntt1</div>
    <div class="lop2" style="background-color: aqua;">cntt2</div>
</body>
</html>
