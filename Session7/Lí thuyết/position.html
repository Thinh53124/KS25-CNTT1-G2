<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            border: 2px solid black;
            position: relative;
        }
        .box2{
            position: relative;
            bottom: 50px;
            left: 10px;
        }
    </style>
</head>

<body>
    <!--
    position: dùng để định vị vị trí tron html
    có 5 giá trị:
    - static: trạng thái mặc định
    - relative: 
    - absolute:
    - fixed: cố định thanh taskbar
    - sticky:
    -->
    <div class="box1 box">
        box1
    </div>
    <div class="box2 box">
        box2
    </div>
</body>

</html>
