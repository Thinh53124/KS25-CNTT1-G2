<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo Tet</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>

<div class="container">

    <h1>Công việc chuẩn bị Tết</h1>
    <p>Thêm, sửa, hoàn thành & xóa</p>

    <!-- THEM -->
    <div class="add-box">
        <input id="new-task" type="text" placeholder="Nhap cong viec moi...">
        <button id="add-btn">Them</button>
    </div>

    <!-- THONG KE -->
    <div id="stats"></div>

    <!-- DANH SACH -->
    <ul id="todo-list"></ul>

    <!-- XOA TAT CA -->
    <button id="clear-all">Xoa toan bo danh sach</button>

</div>

<script src="script6.js"></script>
</body>
</html>
