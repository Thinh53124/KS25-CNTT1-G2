<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo Tet</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>

<div class="container">

    <h1>Công việc chuẩn bị Tết</h1>
    <p>Thêm, chỉnh sửa, hoàn thành & xóa công việc</p>

    <!-- THEM CONG VIEC -->
    <div class="add-box">
        <input 
            id="new-task" 
            type="text" 
            placeholder="Nhap cong viec moi..." 
        >
        <button id="add-btn">Them</button>
    </div>

    <!-- DANH SACH -->
    <ul id="todo-list"></ul>

    <small>
        Click vao cong viec de danh dau | ✏️ sua | 🗑️ xoa
    </small>

</div>

<script src="script5.js"></script>

</body>
</html>
