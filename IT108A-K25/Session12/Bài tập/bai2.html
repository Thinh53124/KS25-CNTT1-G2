<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./bai2.css">
</head>

<body>
    <div class="card">
        <div class="card-header">
            <span class="badge">Bán chạy</span>
            <div class="icon">
                <i class="fa-solid fa-code"></i>
            </div>
        </div>

        <div class="card-body">
            <span class="tag">Lập trình</span>
            <div class="star">⭐ 4.9</div>

            <h3 class="title">Lập trình Web Full Stack</h3>
            <p class="description">Học lập trình web từ cơ bản đến nâng cao với các công nghệ hiện đại nhất</p>

            <div class="stats">
                <span>🕒 40 giờ</span>
                <span>👥 12K+ học viên</span>
            </div>

            <hr>
            <div class="card-footer">
                <span class="price">2.990.000đ</span>
                <button class="detail">Xem chi tiết</button>
            </div>
        </div>
    </div>
</body>

</html>
