<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bai8.css">
</head>

<body>
    <div class="course-page">
        <h2>Danh sách khóa học</h2>
        <div class="course-list">
            <section class="course-card">
                <div class="course-img">
                    <img src="./Gemini_Generated_Image_3tkgtb3tkgtb3tkg.png" alt="">
                    <div class="badge">
                        <p class="studying">Đang học</p>
                    </div>
                </div>
                <p class="category">Thiết kế</p>
                <h3>UI/UX Design Chuyên Nghiệp</h3>
                <p class="info">Giảng viên: Trần Thị B</p>
                <div class="progress">
                    <p>Tiến độ học tập <span>20%</span></p>
                    <div class="bar">
                        <div class="brogress-bar p20"></div>
                    </div>
                </div>
                <button class="btn primary">Tiếp tục học</button>
            </section>
            <section class="course-card">
                <div class="course-img">
                    <img src="./Gemini_Generated_Image_9luhgl9luhgl9luh.png" alt="">
                    <div class="badge">
                        <p class="done">Hoàn thành</p>
                    </div>
                </div>
                <p class="category">Marketing</p>
                <h3>Digital Marketing Toàn Diện</h3>
                <p class="info">Giảng viên: Lê Văn C</p>
                <div class="progress">
                    <p>Hoàn thành <span>100%</span></p>
                    <div class="bar">
                        <div class="progress-bar p100"></div>
                    </div>
                </div>
                <button class="btn outline">Xem lại</button>
            </section>
            <section class="course-card">
                <div class="course-img">
                    <img src="./Gemini_Generated_Image_hnxqhahnxqhahnxq.png" alt="">
                    <div class="badge">
                        <p class="save">Đã lưu</p>
                    </div>
                </div>
                <p class="category">AI & Data</p>
                <h3>Machine Learning Cơ Bản</h3>
                <p class="info">Giảng viên: Phạm Thị D</p>
                <div class="price">
                    <p class="new-price">2.799.000đ</p>
                    <p class="old-price">3,999,000</p>
                </div>
                <button class="btn primary">Đăng ký ngay</button>
            </section>
        </div>
    </div>
</body>

</html>
