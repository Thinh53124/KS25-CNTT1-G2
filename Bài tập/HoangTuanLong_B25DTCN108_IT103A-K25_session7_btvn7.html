<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="./HoangTuanLong_B25DTCN108_IT103A-K25_session7_btvn7.css">
</head>
<body>
    <div class="feedback">
        <h1>Biểu mẫu Feedback Phòng Khám Nha Khoa</h1>
        <br/>
        <label>Họ và tên</label>
        <br/>
        <input type="text" placeholder="Nhập họ tên">
        <br/>
        <label>Email</label>
        <br/>
        <input type="email" placeholder="example@gmail.com">
        <br/>
        <label>Dịch vụ đã sử dụng</label>
        <br/>
        <select name="dv">
            <option value="tq">Khám răng tổng quát</option>
            <option value="cr">Lấy cao răng</option>
            <option value="tr">Làm trắng răng</option>
        </select>
        <br/>
        <label>Mức độ hài lòng</label>
        <br/>
        <select name="level">
            <option value="vst">Rất hài lòng</option>
            <option value="st">Hài lòng</option>
            <option value="ust">Không hài lòng</option>
        </select>
        <br/>
        <label>Nội dung phản hồi</label>
        <br/>
        <textarea placeholder="Hãy cho chúng tôi biết cảm nhận của bạn..."></textarea>
        <button>Gửi feedback</button>
    </div>
</body>
</html>
