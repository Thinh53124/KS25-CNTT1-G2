<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Bai7Session10.css">
</head>

<body>
    <header>
        <div class="imagehead">
            <img src="./Section.png" alt="section">
        </div>
    </header>
    <main>
        <div class="maincontent">
            <div class="upperimage">
                <div class="image"><img src="./Overlay+Shadow.png" alt="mainspace"></div>
                <div class="image"><img src="./Overlay+Shadow(2).png" alt="dish"></div>
                <div class="image"><img src="./Overlay+Shadow(3).png" alt="highmaincourse"></div>
                <div class="image"><img src="./Overlay+Shadow(7).png" alt="wondertable"></div>
            </div>
            <div class="bottomimage">
                <div class="image"><img src="./Overlay+Shadow(4).png" alt="table"></div>
                <div class="image"><img src="./Overlay+Shadow(5).png" alt="openkitchen"></div>
                <div class="image"><img src="./Overlay+Shadow(6).png" alt="desert"></div>
            </div>
        </div>
        <div class="date">
            <div class="formdate">
                <h2>Đặt bàn ngay hôm nay</h2>
                <p>Chúng tôi sẽ liên hệ xác nhận trong vòng 1 giờ</p>
                <form action="myserver.com" method="GET" >
                    <div class="upperform">
                        <input type="text" name="username" placeholder="Họ và tên" required>
                        <input type="tel" name="telephone" placeholder="Số điện thoại">
                        <input type="email" name="Email" placeholder="Email" required>
                    </div>
                    <div class="bottomform">
                        <input type="date" placeholder="ngay">
                        <input type="time" placeholder="thoi gian">
                        <input type="number" name="guestnumber" placeholder="Số lượng khách">
                    </div>
                    <br>
                    <button type="submit">Gửi Yêu Cầu Đặt Bàn</button>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <div class="last">
            <p>&copy; 2025 La Belle Époque - Fine Dining Restaurant . All rights reserved</p>
        </div>
    </footer>
</body>

</html>
