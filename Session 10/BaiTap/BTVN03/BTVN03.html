<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTVN03</title>
    <link rel="stylesheet" href="./BTVN03.css" />
  </head>
  <body>
        <div class="container">
          <h1>Món Nổi Bật Hôm Nay</h1>

          <div class="dishes-row">
            <div class="dish-card dish-big">
              <img
                src="https://images.pexels.com/photos/769289/pexels-photo-769289.jpeg"
                alt="Grilled Wagyu Beef Tenderloin"
              />
              <div class="dish-info">
                <h3>Grilled Wagyu Beef Tenderloin</h3>
                <p class="price">1.200.000 đ</p>
              </div>
            </div>

            <div class="dish-card dish-small">
              <img
                src="https://images.pexels.com/photos/566566/pexels-photo-566566.jpeg"
                alt="Seared Scallops"
              />
              <div class="dish-info">
                <h3>Seared Scallops</h3>
                <p class="price">320.000 đ</p>
              </div>
            </div>

            <div class="dish-card dish-small">
              <img
                src="https://images.pexels.com/photos/1437267/pexels-photo-1437267.jpeg"
                alt="Truffle Deviled Eggs"
              />
              <div class="dish-info">
                <h3>Truffle Deviled Eggs</h3>
                <p class="price">180.000 đ</p>
              </div>
            </div>
          </div>

          <div class="dishes-row">
            <div class="dish-card dish-big">
              <img
                src="https://images.pexels.com/photos/1833349/pexels-photo-1833349.jpeg"
                alt="Lobster Bisque"
              />
              <div class="dish-info">
                <h3>Lobster Bisque</h3>
                <p class="price">420.000 đ</p>
              </div>
            </div>

            <div class="dish-card dish-big">
              <img
                src="https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg"
                alt="Pan-Seared Foie Gras"
              />
              <div class="dish-info">
                <h3>Pan-Seared Foie Gras</h3>
                <p class="price">580.000 đ</p>
              </div>
            </div>
          </div>
        </div>
  </body>
</html>
