<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!-- flexbox:dùng làm layout thay đổi bố cục các phần tử
     1.fex-container:phần tử cha
     2.flex-item:phần tử con
     3. để 1 phần tử (khối)có thể sử dụng được các thuộc tính của flex-box 
     display:flex(none,block,) 
     4.các trục trong flexbox
     chia làm 2 trục
     +trục chính(main axis)
     +trục chéo(cross axis)
     ==>luôn luôn vuông góc với nhau
     5.Các thuộc tính(properties) trong flex box
     5.1 flex-direction:quyết định vị trí của main-axis và cross axis
     cái nào nằm ngang cái nào nằm dọc
     giá trị mặc định là row
     nếu flex-direction:column main axis nằm dọc còn cross nằm ngang
     5.2 jusstify content sẽ luôn luôn căn chỉnh phần tử theo trục main axis
     5.3 align-item:sẽ luôn luôn ăn theo trục phụ
     5/4flex-wrap(nowrap trạng thái mặc định)
     5.5gap:khoảng cách giữa các flex và item  
     5.6:align-content: khoảng cách giữa các dòng căn theo trục y
     (điều kiện bắt buộc thuộc tính flex-wrap:WRAP)-->
     <div class="container">
        <div class="item">1
            <div>1.1</div>
            <div>1.2</div>
        </div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
     </div>
</body>
</html>
