<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn{
            border:none;
            padding:10px;
            background-color: green;
            color:#fff;
            border-radius:5px;
            transition: all;
        }
        .btn:hover{
            background-color: red;
        }
    </style>
</head>
<body>
    <!-- transition:chuyển đổi 
     1.tên thuộc tính cần xử lý
     2.thời gian thực hiện
     3.timing function:tốc độ hiệu ứng
     4.delay-->
     <button class="btn">login</button>
</body>
