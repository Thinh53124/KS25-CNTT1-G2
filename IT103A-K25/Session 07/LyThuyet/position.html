<!DOCTYPE html>
<html lang="en">
<head>

    <title>Position</title>
    <style>
        /* div{

        .box{
            width: 100px;
            height: 100px;

        }
        .box2{

        }
    </style>
</head>
<body>
    <!-- 
        position: định vị vị trí của các phần tử : element
        có 5 giá trị:
        + Static: Trạng thái mặc định
        + Relative: Vị trí tương đối : lấy theo vị trí ban đầu của nó làm mốc
        + Absolute: 
        + Fixed: 
        + Sticky: 
    -->
    <div class="box1 box">
        box1
    </div>
    <div class="box2 box">
        box2
    </div>
</body>
