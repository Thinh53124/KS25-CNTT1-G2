<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - E-learning</title>
    <link rel="stylesheet" href="btvn02.css">
</head>

<body>
    <div class="container">
        <div class="form-card">
            <h1 class="form-title">Đăng nhập</h1>
            <p class="form-subtitle">Đăng nhập để sử dụng hệ thống e-learning</p>

            <form class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu">
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="forgot-password">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="submit-btn">Đăng nhập</button>
            </form>

            <div class="form-footer">
                <span>Chưa có tài khoản?</span>
                <a href="#" class="register-link">Đăng ký ngay</a>
            </div>
        </div>
    </div>
</body>

</html>
