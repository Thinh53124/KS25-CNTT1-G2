<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Trịnh Huy Hoàng</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <h2>Explore Our Products</h2>
        <nav class="arrows">
            <p><i class="fa-solid fa-arrow-left"></i></p>
            <p><i class="fa-solid fa-arrow-right"></i></p>
        </nav>
    </header>
    <main>
        <div class="cards">
            <div class="card-info">
                <div class="card-img">
                    <img src="./img/img (7).png" alt="">
                </div>
                <div class="card-des">
                    <h3>Breed Dry Dog Food</h3>
                </div>
                <div class="card-price">$100</div>
                <div class="rating"><img src="./img/Four Star.png" alt=""></div>
                <div class="amount">
                    <p>(35)</p>
                </div>
            </div>
            <div class="card-info">
                <div class="card-img">
                    <img src="./img/img (1).png" alt="">
                </div>
                <div class="card-des">
                    <h3>CANON EOS DSLR Camera</h3>
                </div>
                <div class="card-price">$360</div>
                <div class="rating"><img src="./img/Four Star.png" alt=""></div>
                <div class="amount">
                    <p>(95)</p>
                </div>
            </div>
            <div class="card-info">
                <div class="card-img">
                    <img src="./img/img (2).png" alt="">
                </div>
                <div class="card-des">
                    <h3>ASUS FHD Gaming Laptop</h3>
                </div>
                <div class="card-price">$700</div>
                <div class="rating"><img src="./img/Five star.png" alt=""></div>
                <div class="amount">
                    <p>(325)</p>
                </div>
            </div>
            <div class="card-info">
                <div class="card-img">
                    <img src="./img/Cart.png" alt="">
                </div>
                <div class="card-des">
                    <h3>Curology Product Set </h3>
                </div>
                <div class="card-price">$500</div>
                <div class="rating"><img src="./img/Four Star.png" alt=""></div>
                <div class="amount">
                    <p>(145)</p>
                </div>
            </div>
            <div class="card-info">
                <div class="card-img">
                    <img src="./img/img (3).png" alt="">
                </div>
                <div class="card-des">
                    <h3>Kids Electric Car </h3>
                </div>
                <div class="card-price">$960</div>
                <div class="rating"><img src="./img/Five star.png" alt=""></div>
                <div class="amount">
                    <p>(65)</p>
                </div>
            </div>
            <div class="card-info">
                <div class="card-img">
                    <img src="./img/img (4).png" alt="">
                </div>
                <div class="card-des">
                    <h3>Jr. Zoom Soccer Cleats</h3>
                </div>
                <div class="card-price">$1160</div>
                <div class="rating"><img src="./img/Five star.png" alt=""></div>
                <div class="amount">
                    <p>(35)</p>
                </div>
            </div>
            <div class="card-info">
                <div class="card-img">
                    <img src="./img/img (5).png" alt="">
                </div>
                <div class="card-des">
                    <h3>GP11 Shooter USB Gamepad</h3>
                </div>
                <div class="card-price">$650</div>
                <div class="rating"><img src="./img/Four Half Star.png" alt=""></div>
                <div class="amount">
                    <p>(55)</p>
                </div>
            </div>
            <div class="card-info">
                <div class="card-img">
                    <img src="./img/img (6).png" alt="">
                </div>
                <div class="card-des">
                    <h3>Quilted Satin Jacket</h3>
                </div>
                <div class="card-price">$660</div>
                <div class="rating"><img src="./img/Four Half Star.png" alt=""></div>
                <div class="amount">
                    <p>(55)</p>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
