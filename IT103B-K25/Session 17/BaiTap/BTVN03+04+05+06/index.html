<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3 + 4 + 5 + 6</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Công việc chuẩn bị Tết</h1>
    <p>Thêm công việc mới & đánh dấu hoàn thành</p>
  </header>

  <main>
    <div class="form--contener">
      <div class="input-group">
        <input type="text" id="input--task" required>
        <label for="input--task">Nhập công việc mới...</label>
      </div>

      <button class="btn--add">Thêm</button>
      <button class="btn--deleteAll">Xóa tất cả</button>
    </div>

    <div class="toDoList"></div>
  </main>

  <footer>
    <hr>
    <p>Mọi thay đổi (thêm / đánh dấu) được lưu tự động vào localStorage . Refresh để kiểm tra</p>
  </footer>

  <script src="main.js"></script>
</body>

</html>
