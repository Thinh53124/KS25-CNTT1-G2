<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Todo Tết</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Công việc chuẩn bị Tết</h1>
            <p>Click để đánh dấu hoàn thành</p>
        </header>

        <div class="add-section">

            <input id="task-input" placeholder="Nhập công việc mới...">

            <button id="add-btn">Thêm</button>

            <button id="clear-all">Xóa toàn bộ</button>

        </div>

        <div id="stats"></div>

        <div id="todo-list" class="todo-list"></div>

        <footer>
            Dữ liệu lưu trong localStorage
        </footer>

    </div>

    <script src="main.js"></script>

</body>

</html>
