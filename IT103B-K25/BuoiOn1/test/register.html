<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./register.css">
</head>
<body>
  <div class="background">
    <div class="container">
      <div class="form-box">
        <div class="form-header">
          <h1><i class="fas fa-user-plus"></i> Đăng Ký Tài Khoản</h1>
          <p>Tạo tài khoản mới để bắt đầu</p>
        </div>

        <form id="form">
          <div class="form-group">
            <label for="username">
              <i class="fas fa-user"></i> Tên người dùng
            </label>
            <input 
              type="text" 
              id="username" 
              placeholder="Nhập tên người dùng của bạn"
              required
            >
            <p class="error" id="error-name">Tên không được để trống!</p>
          </div>

          <div class="form-group">
            <label for="email">
              <i class="fas fa-envelope"></i> Email
            </label>
            <input 
              type="email" 
              id="email" 
              placeholder="Nhập địa chỉ email"
              required
            >
            <p class="error" id="error-email"></p>
            <p class="error" id="error-email-exist"></p>
          </div>

          <div class="form-group">
            <label for="password">
              <i class="fas fa-lock"></i> Mật khẩu
            </label>
            <div class="password-input">
              <input 
                type="password" 
                id="password" 
                placeholder="Nhập mật khẩu (ít nhất 8 ký tự)"
                required
              >
              <i class="fas fa-eye toggle-password" data-target="password"></i>
            </div>
            <p class="error" id="error-password"></p>
            <div class="password-strength">
              <div class="strength-bar"></div>
            </div>
          </div>

          <div class="form-group">
            <label for="confirm-password">
              <i class="fas fa-lock"></i> Xác nhận mật khẩu
            </label>
            <div class="password-input">
              <input 
                type="password" 
                id="confirm-password" 
                placeholder="Nhập lại mật khẩu"
                required
              >
              <i class="fas fa-eye toggle-password" data-target="confirm-password"></i>
            </div>
            <p class="error" id="error-confirm"></p>
          </div>

          <button type="submit" class="btn-submit">
            <i class="fas fa-user-check"></i> Đăng Ký
          </button>
        </form>

        <div class="form-footer">
          <p>Đã có tài khoản? <a href="login.html">Đăng nhập tại đây</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="./register.js"></script>
</body>
</html>
