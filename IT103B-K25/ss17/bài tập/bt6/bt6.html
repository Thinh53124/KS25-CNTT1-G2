<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công việc chuẩn bị Tết</title>
    <link rel="stylesheet" href="./bt6.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="todo-container">
        <header class="header">
            <h1>Công việc chuẩn bị Tết</h1>
            <p>Quản lý công việc hiệu quả</p>
        </header>

        <div class="input-section">
            <div id="stats" class="stats-container">
                </div>

            <div class="add-controls">
                <input type="text" id="taskInput" placeholder="Nhập công việc mới...">
                <button class="btn-add" id="btnAdd">Thêm</button>
            </div>
            
            <button id="btnClearAll" class="btn-clear-all">🗑️ Xóa toàn bộ danh sách</button>
        </div>

        <div class="task-list" id="taskList"></div>

        <footer class="footer-note">
            Dữ liệu được lưu tại key "myTodos" • Refresh để kiểm tra
        </footer>
    </div>
    <script src="./bt6.js"></script>
</body>
</html>
