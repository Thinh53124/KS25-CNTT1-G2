<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công việc chuẩn bị Tết</title>
    <link rel="stylesheet" href="./bt2.css">
</head>

<body>

    <div class="container">
        <header class="header">
            <h1>Công việc chuẩn bị Tết</h1>
            <p>Click để đánh dấu hoàn thành</p>

        <div class="task-list">

                <div class="status-icon">✓</div>

            </div>

            <div class="task-item completed">
                <div class="status-icon">✓</div>
                <div class="task-text">Dọn nhà đón Tết</div>
            </div>

            <div class="task-item">
                <div class="status-icon"></div>
                <div class="task-text">Gói bánh chưng</div>
            </div>

            <div class="task-item">
                <div class="status-icon"></div>
                <div class="task-text">Trang trí nhà cửa bằng hoa mai, hoa đào</div>
            </div>

            <div class="task-item">
                <div class="status-icon"></div>
                <div class="task-text">Mua phong bao lì xì</div>
            </div>

            <div class="task-item">
                <div class="status-icon"></div>
                <div class="task-text">Chuẩn bị mâm ngũ quả</div>
            </div>
        </div>

        <footer class="footer">
            Trạng thái được lưu tự động vào localStorage • Refresh để kiểm tra
        </footer>
    </div>
    <script src="./bt2.js"></script>
