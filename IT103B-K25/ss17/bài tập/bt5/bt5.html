<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công việc chuẩn bị Tết</title>
    <link rel="stylesheet" href="./bt5.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="todo-container">
        <header class="header">
            <h1>Công việc chuẩn bị Tết</h1>
            <p>Thêm công việc mới & quản lý danh sách</p>
        </header>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Nhập công việc mới...">
            <button class="btn-add" id="btnAdd">Thêm</button>
        </div>

        <div class="task-list" id="taskList"></div>

        <footer class="footer-note">
            Mọi thay đổi được lưu tự động vào localStorage • Refresh để kiểm tra
        </footer>
    </div>
    <script src="./bt5.js"></script>
</body>
</html>
