<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuẩn bị Tết Nguyên Đán</title>
    <link rel="stylesheet" href="./bt1.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <h1>Chuẩn bị Tết Nguyên Đán</h1>
            <p>Danh sách việc cần làm</p>

        <div class="task-list">

                    <span class="icon">🌸</span>
                    <span class="text">Mua bánh chưng</span>
                </div>
                <span class="status">Chưa làm</span>
            </div>

            <div class="task-item">
                <div class="task-content">
                    <span class="icon">🌸</span>
                    <span class="text">Dọn nhà đón Tết</span>
                </div>
                <span class="status">Chưa làm</span>
            </div>

            <div class="task-item">
                <div class="task-content">
                    <span class="icon">🌸</span>
                    <span class="text">Gói bánh chưng</span>
                </div>
                <span class="status">Chưa làm</span>
            </div>

            <div class="task-item">
                <div class="task-content">
                    <span class="icon">🌸</span>
                    <span class="text">Trang trí nhà cửa</span>
                </div>
                <span class="status">Chưa làm</span>
            </div>
        </div>

        <footer class="footer">
            Đã lưu vào localStorage lần đầu tiên • Refresh trang để kiểm tra
        </footer>
    </div>
    <script src="./bt1.js"></script>

</html>
