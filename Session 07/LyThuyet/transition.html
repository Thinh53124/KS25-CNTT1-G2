<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition</title>
    <style>
        .btn{
            border: none;
            padding: 10px;
            background-color: cyan;
            color: #fff;
            border-radius: 5px;
            transition: all 5s ;
        }
        .btn:hover{
            background-color: red;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 
    
    -->
    <button class="btn">login</button>
</body>
</html>
