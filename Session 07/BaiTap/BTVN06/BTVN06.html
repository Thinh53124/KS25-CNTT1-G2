<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTVN06</title>
    <link rel="stylesheet" href="./BTVN06.css">
</head>

<body>
    <div class="treatment-card">
        <div class="card-header">
            <h2>Niềng răng chỉnh nha</h2>
            <span class="status-badge">ĐANG ĐIỀU TRỊ</span>
        </div>

        <div class="info-row">
            <span class="label">Bác sĩ </span>
            <span class="icon">👨‍⚕️</span>
            <span class="value">: BS. Nguyễn Minh Tâm</span>
        </div>

        <div class="info-row">
            <span class="label">Chi phí </span>
            <span class="icon">💰</span>
            <span class="value">: 25.000.000 đ</span>
        </div>

        <div class="progress-section">
            <div class="progress-title">Tiến trình điều trị</div>
            <div class="progress-bar-container">
                <div class="progress-bar"></div>
            </div>
        </div>

        <div class="date-info">
            <div>Bắt đầu: 10/03/2025</div>
            <div>Dự kiến hoàn thành: 10/03/2026</div>
        </div>
    </div>
</body>

</html>
