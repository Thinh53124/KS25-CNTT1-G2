<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="../styles/register.css">
</head>
<body>
    <h1>Đăng ký tài khoản</h1>

    <form action="">
        <!-- Username -->
        <span>Tên người dùng</span>
        <input type="text" placeholder="Nhập tên" id="username"><br>
        <p class="error-name"></p>

        <!-- Email -->
        <span>Email</span>
        <input type="text" placeholder="Nhập email" id="email"><br>
        <p class="error-email"></p>

        <!-- Password -->
        <span>Mật khẩu</span>
        <input type="password" placeholder="Nhập mật khẩu" id="password"><br>
        <p class="error-password"></p>

        <!-- Confirm Password -->
        <span>Xác nhận mật khẩu</span>
        <input type="password" placeholder="Xác nhận mật khẩu" id="confirm"><br>
        <p class="error-confirm"></p>

        <!-- Button -->
        <button onclick="register(event)">Đăng ký</button>
    </form>

    <script src="../js/register.js"></script>
</body>
</html>
