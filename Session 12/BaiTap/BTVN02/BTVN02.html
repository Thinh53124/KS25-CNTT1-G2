<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Card</title>
    <link rel="stylesheet" href="./BTVN02.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="course-card">
            <div class="course-card__badge">Bán chạy</div>
            <div class="course-card__top">
                <div class="course-card__icon">
                    &lt;/&gt;
                </div>
            </div>
            <div class="course-card__bottom">
                <div class="course-card__meta-top">
                    <span class="course-card__tag">Lập trình</span>
                    <span class="course-card__rating">
                        <span class="course-card__rating-star">★</span>
                        4.9
                    </span>
                </div>
                <h2 class="course-card__title">Lập trình Web Full Stack</h2>
                <p class="course-card__desc">
                    Học lập trình web từ cơ bản đến nâng cao với các công nghệ hiện đại nhất
                </p>
                <div class="course-card__info-row">
                    <div class="course-card__info-item">
                        <span class="course-card__info-icon">⏱</span>
                        <span>40 giờ</span>
                    </div>
                    <div class="course-card__info-item">
                        <span class="course-card__info-icon">👥</span>
                        <span>12K+ học viên</span>
                    </div>
                </div>
                <div class="course-card__footer">
                    <span class="course-card__price">2.990.000đ</span>
                    <button class="course-card__btn">Xem chi tiết</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
