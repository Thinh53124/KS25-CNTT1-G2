<body>
    <!-- Reponsive :kỹ thuật thiết kế web tương thích với nhiều thiết bị
     tức là giao diện có thể phù hợp khi dùng với các thiết bị như máy tính,máy tính bàn,điện thoại,máy tính bảng
     1.Mobile first: thiết kế web trên màn hình đt trước,sau đó thiết kế lên các màn hình lớn hơn (table,desktop)
     2.Desktop first:Thiết kế web trên màn hình máy tính để bàn trước sau đó xuống các màn hình bé hơn (laptop,máy tính bảng,điện thoại,...)
     3.Các điểm breakpoint:giới hạn kích thước đối với các thiết bị
     +<=576px || 600px:giới hạn kích thước màn hình điện thoại
     +576||600 <= X <= 768px :máy tính bảng
     +768<X<=1200px:laptop
     +>1200:máy tính để bàn 
     4.media querry:
     +đối với desktop first
     +đối với mobile first
     5.Các thẻ meta phục vụ cho việc responsive:
     6.Khi dùng flex;
     flex-wrap:tự động xuống hàng khi ko đủ tiện ích
     grid:
     Taiwind,ANT, MERTERIAL,....
     +-->
    <div class="mobile">
        Reponsive
    </div>
</body>
</html>
