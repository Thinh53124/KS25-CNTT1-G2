<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Eater&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Quicksand:wght@300..700&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&family=Staatliches&display=swap"
      rel="stylesheet"
    />
    <script src="../JS/admin.js" defer></script>
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div class="sidebar">
      <div class="logo">
        <div class="img-logo">
          <img src="../assets/img/Icon.png" alt="" />
        </div>
        <span class="logo1">Rikkei</span>
        <span class="logo2">Cinema</span>
      </div>
      <div class="tabs">
        <div class="tab tab-select">
          <i class="fa-solid fa-clapperboard"></i>
          <p>Quản lý phim</p>
        </div>
        <div class="tab">
          <i class="fa-solid fa-ticket"></i>
          <p>Quản lý vé</p>
        </div>
      </div>
      <div class="sidebar-footer">
        <img src="../assets/img/4b3c32e708cfeaf4ac3b720d07977c0fcfc63eec.jpg" alt="" />
        <div class="admin-info">
          <p class="footer-name">Admin Quản lý</p>
          <p class="footer-email">LQTuan@rikkei.edu.vn</p>
        </div>
        <i class="fa-solid fa-arrow-right-from-bracket" onclick="showLogout()"></i>
      </div>
    </div>
    <main>
        <div id="logout">
            <div id="logout-content">
                <div id="logout-icon">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h2>Đăng xuất</h2>
                <p>Bạn có chắc chắn muốn đăng xuất không?</p>
            </div>
            <div id="logout-btn">
                <button id="logout-cancel-btn" onclick="hideLogout()">Hủy</button>
                <button id="logout-submit-btn" onclick="logoutToLogin()">Đồng ý</button>
            </div>
        </div>
    </main>
  </body>
</html>
