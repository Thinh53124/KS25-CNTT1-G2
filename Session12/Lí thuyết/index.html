<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 
    RESPONSIVE: kỹ thuật thiết kế web tương thích với nhiều thiết bị
    tức là giao diện có thể phù hợp khi dùng với các thiết bị như (máy tính bàn, máy tính bảng, điện thoại,......)

    1.Mobile first: thiết kế web trên màn hình điện thoại trước, sau đó thiết kế lên các màn hình lớn hơn (tablet, desktop)
    2.Desktop first: thiết kế web trên màn hình máy tính trước sau đó xuống các màn hình bé hơn(laptop, máy tính bảng , điện thoại,.....)
    3. Các điểm breakpoint: điểm giới hạn kích thước đối với các thiết bị
        + <=576px || 600px : kích thước màn hình điện thoại
        + 576px || 600px <= X <= 768px: máy tính bảng
        + 768px < X <= 1200px: laptop
        + > 1200px : máy tính để bàn
    4. mediaquery:
        + đối với desktop first: phải dùng max-width, thiết lập thông số từ lớn xuống bé
        @media screen and (max-width: 1200px){
            viết code css
        }   

        + đối với mobile first: dùng min-width, đi từ bé đến lớn

    5. Các thẻ phục vụ cho việc responsive
    6. Khi dùng flex:
    - flex-warp: warp : tự động xuống hầng khi không đủ diện tích
    grid: 

    TAIWIND, ANT, MATERIAL, BOOTSTRAP
    
    -->
        <div class="container">
            <p>RESPONSIVE</p>
        </div>
        <p>học CSS</p>
        <button class="btn">login</button>
</body>
</html>
