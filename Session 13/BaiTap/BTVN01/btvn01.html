<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - E-learning</title>
    <link rel="stylesheet" href="btvn01.css">
</head>

<body>
    <div class="container">
        <div class="form-card">
            <h1 class="form-title">Đăng ký</h1>
            <p class="form-subtitle">Tạo tài khoản để bắt đầu học tập trên hệ thống e-learning</p>

            <form class="registration-form">
                <div class="name-row">
                    <div class="form-group">
                        <label for="first-name">Họ và tên đệm</label>
                        <input type="text" id="first-name" name="first-name" value="Nguyễn Văn">
                    </div>
                    <div class="form-group">
                        <label for="last-name">Tên đầy đủ</label>
                        <input type="text" id="last-name" name="last-name" value="An">
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone" value="0912 345 678">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email">
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Nhập lại mật khẩu</label>
                    <input type="password" id="confirm-password" name="confirm-password"
                        placeholder="Nhập lại mật khẩu">
                </div>

                <button type="submit" class="submit-btn">Đăng ký</button>
            </form>

            <div class="form-footer">
                <span>Đã có tài khoản?</span>
                <a href="#" class="login-link">Đăng nhập</a>
            </div>
        </div>
    </div>
</body>

</html>
