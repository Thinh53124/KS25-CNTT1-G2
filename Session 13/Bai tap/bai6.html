<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bai6.css">
</head>
<body>

<section class="course-page">
    <h2>Danh sách khóa học</h2>
    <section class="course-list">
        <section class="course-card">
            <div class="course-img">
                <img src="./7e3aaade-4be8-47a8-aa6c-fe6f0c220316-cover.png" alt="">
                <p class="badge studying">Đang học</p>
            </div>
            <p class="category">Thiết kế</p>
            <h3>UI/UX Design Chuyên Nghiệp</h3>
            <p class="teacher">Giảng viên: Trần Thị B</p>
            <div class="progress">
                <p>Tiến độ học tập <span>20%</span></p>
                <div class="bar">
                    <div class="bar-fill w20"></div>
                </div>
            </div>
            <button class="btn primary">Tiếp tục học</button>
        </section>
        <section class="course-card">
            <div class="course-img">
                <img src="./60dc4c88e1dbc9b8465f7b36_digital-marketing.jpeg" alt="">
                <p class="badge done">Hoàn thành</p>
            </div>
            <p class="category">Marketing</p>
            <h3>Digital Marketing Toàn Diện</h3>
            <p class="teacher">Giảng viên: Lê Văn C</p>
            <div class="progress">
                <p>Hoàn thành <span>100%</span></p>
                <div class="bar">
                    <div class="bar-fill w100"></div>
                </div>
            </div>
            <button class="btn outline">Xem lại</button>
        </section>
        <section class="course-card">
            <div class="course-img">
                <img src="./1_cG6U1qstYDijh9bPL42e-Q.jpg" alt="">
                <p class="badge save">Đã lưu</p>
            </div>
            <p class="category">AI & Data</p>
            <h3>Machine Learning Cơ Bản</h3>
            <p class="teacher">Giảng viên: Phạm Thị D</p>
            <p class="price">2.799.000đ</p>
            <button class="btn primary">Đăng ký ngay</button>
        </section>
    </section>
</section>
</body>
</html>
