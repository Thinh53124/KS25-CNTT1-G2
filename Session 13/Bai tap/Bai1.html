<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Bai1.css">
</head>

<body>
    <div class="formregister">
        <div class="title">
            <h1>Đăng ký</h1>
            <p>Tạo tài khoản để bắt đầu học tập trên hệ thống E-learning</p>
        </div>
        <form action="Myserver.com" method="GET">
            <div class="nameuser">
                <div class="firstname">
                    <label for="firstname">Họ và tên đệm</label>
                    <br>
                    <input type="text" name="firstname" placeholder="Nguyễn Văn">
                </div>
                <div class="lastname">
                    <label for="lastname">Tên đầy đủ</label>
                    <br>
                    <input type="text" name="lastname" placeholder="An">
                </div>
            </div>
            <div class="bottom">
                <label for="tele">Số điện thoại</label>
                <br>
                <input type="tele" name="tele" placeholder="0912 345 678">
                <br>
                <label for="email">Email</label>
                <br>
                <input type="email" name="email" placeholder="Nhập địa chỉ email">
                <br>
                <label for="password">Mật khẩu</label>
                <br>
                <input type="password" name="password" placeholder="Nhập mật khẩu" required>
                <br>
                <label for="repeatpassword"> Nhập lại mật khẩu</label>
                <br>
                <input type="password" name="repeatpassword" placeholder="Nhập lại mật khẩu" required>
            </div>
            <br>
            <div class="buttonsubmit">
                <button>Đăng ký</button>
                <br>
                <br>
                <p>Đã có tài khoản? <a href="http://" class="haveacc">Đăng nhập</a></p>
            </div>
        </form>
    </div>
</body>

</html>
